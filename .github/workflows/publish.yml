name: Publish

# Cada push a main que toque código publica en nuget.org la versión 0.1.<número de ejecución>,
# después de compilar, correr las pruebas y el smoke de Native AOT en Linux.
# La publicación usa trusted publishing (OIDC): no hay API key guardada. La política de nuget.org
# autoriza este archivo (publish.yml), el environment "production" y los paquetes TekiumDB*.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'README.es.md'
      - 'CLAUDE.md'
      - 'TekiumDB-plan.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  VERSION: 0.1.${{ github.run_number }}

jobs:
  build:
    name: Build, test and pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build -c Release -p:Version=$VERSION

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Publish (Native AOT)
        run: dotnet publish tests/TekiumDB.AotSmoke -c Release -o artifacts/aot

      - name: Run AOT smoke
        run: ./artifacts/aot/TekiumDB.AotSmoke

      - name: Pack
        run: dotnet pack -c Release --no-build -p:Version=$VERSION -o artifacts/packages

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/
          if-no-files-found: error

  publish:
    name: Push to nuget.org
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write     # NuGet/login pide un token OIDC: sin esto responde 403
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'   # sólo para `dotnet nuget push`

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: mchinchilla73      # perfil de nuget.org dueño de la política, no el correo

      - name: Push
        run: >
          dotnet nuget push "packages/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

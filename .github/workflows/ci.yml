name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      # Criterio de salida de la Fase 0: publicar con Native AOT en los tres sistemas y ejecutar el binario.
      - name: Publish (Native AOT)
        run: dotnet publish tests/Tekium.Embedded.AotSmoke -c Release -o artifacts/aot

      - name: Run AOT smoke
        run: ./artifacts/aot/Tekium.Embedded.AotSmoke
